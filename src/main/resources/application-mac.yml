# ======================================================
# Mac/Linux 专用配置（profile: mac）
# Redis Sentinel + MySQL 33061
# ======================================================
spring:
  config:
    activate:
      on-profile: mac
  # ------------------------
  # MySQL 数据库
  # ------------------------
  datasource:
    url: jdbc:mysql://localhost:33061/sys_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ------------------------
  # Redis Sentinel 集群配置
  # ------------------------
  redis:
    sentinel:
      master: mymaster  # Sentinel 配置中 master 名称
      nodes: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381  # Sentinel 节点
      password: 123456  # Redis master 密码
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms
