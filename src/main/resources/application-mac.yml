# ======================================================
# Mac / Linux 专用配置（profile: mac）
# Redis Sentinel + MySQL 33061
# ======================================================
spring:
  config:
    activate:
      on-profile: mac
  # ------------------------
  # MySQL 数据库
  # ------------------------
  datasource:
    url: jdbc:mysql://localhost:33061/sys_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ------------------------
  # Redis Sentinel 配置（Spring Boot 3.x 正确写法）
  # ------------------------
  data:
    redis:
      # Sentinel 模式
      sentinel:
        master: mymaster
        nodes:
          - 127.0.0.1:26379
          - 127.0.0.1:26380
          - 127.0.0.1:26381
      # Redis Master 密码（Sentinel 会透传）
      password: 123456
      # 连接超时
      timeout: 5000ms
      # Lettuce 连接池
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
