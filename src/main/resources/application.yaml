server:
  port: 18080
#  servlet:
#    context-path: /springboot-admin

spring:
  application:
    name: springboot-admin

  # 数据源配置（同步 MySQL）
  datasource:
    url: jdbc:mysql://localhost:33061/sys_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 同步配置
  redis:
    host: localhost
    port: 6379
    database: 0
    password: 123456
    timeout: 6000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # Jackson 序列化配置
  jackson:
    serialization:
      indent_output: true

# JWT 配置
jwt:
  secret: "mySecretKey2025mySecretKey2025mySecretKey2025"
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  algorithm: HS256

# 日志配置
logging:
  debugMode: true
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.data.redis: DEBUG

# 安全白名单
security:
  whitelist:
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/logout
    - /api/auth/getCaptcha
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs
    - /v3/api-docs/**
    - /swagger-resources/**
    - /webjars/**
