server:
  port: 18080
#  servlet:
#    context-path: /springboot-admin

spring:
  application:
    name: springboot-admin

  # 数据源配置（R2DBC MySQL）
  r2dbc:
    url: r2dbc:mysql://localhost:3306/hr_admin?serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

  # Redis 响应式配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 6000ms
      password: 123456

  # Jackson 序列化配置
  jackson:
    serialization:
      indent_output: true

# JWT 配置
jwt:
  secret: "mySecretKey2025mySecretKey2025mySecretKey2025" # 建议使用 Base64 编码的 32 位以上字符串
  access-token-expiration: 3600000   # 1小时
  refresh-token-expiration: 604800000 # 7天
  algorithm: HS256

# 日志配置
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.data.redis: DEBUG
#    org.springframework.r2dbc.core: TRACE

security:
  whitelist:
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/logout
    - /api/auth/getCaptcha
    - /swagger-ui/**
    - /v3/api-docs/**
    - /swagger-resources/**
    - /webjars/**
    - /favicon.ico

