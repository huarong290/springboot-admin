# ======================================================
# Windows 专用配置（profile: windows）
# 单机 Redis + MySQL 3306
# ======================================================
spring:
  config:
    activate:
      on-profile: windows

  # ------------------------
  # MySQL 数据库
  # ------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/sys_admin?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ------------------------
  # 单机 Redis 配置
  # ------------------------
  redis:
    host: 127.0.0.1
    port: 6379
    password: 123456
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

